# ProjectConfig Schema
# 프로젝트 초기화 시 이 형식으로 config.yaml을 작성한다.
#
# 사용법:
#   1. projects/{project_name}/config.yaml에 복사
#   2. 각 필드를 프로젝트에 맞게 수정
#   3. input/ 폴더에 시놉시스 및 레퍼런스 파일 배치

title: ""                    # 작품 제목 (가제 포함)

source_format: ""            # 원작 형식
  # shortform   - 숏폼 (90초~3분 × N화)
  # webdrama    - 웹드라마
  # novel       - 소설/웹소설
  # webtoon     - 웹툰
  # real_story  - 실화 기반
  # original    - 오리지널 시나리오

target_format: screenplay    # 산출 형식
  # screenplay  - 장편 영화 시나리오 (prompts/{analyst,writer,critic}/)
  # web_novel   - 연재 웹소설 (prompts/webnovel/)

target_duration: 90          # 목표 러닝타임 (분), 기본값 90 — screenplay 전용

genre: []                    # 장르 태그 (예: ["실화 범죄", "심리 스릴러", "로맨스"])

tone: ""                     # 톤 (예: "로맨스→스릴러 전환", "다크 코미디")

theme_direction: ""          # 테마적 방향성
  # 한 문장으로 이 작품이 말하고자 하는 것

synopsis_file: ""            # 시놉시스 파일명 (input/ 내)
  # 예: synopsis.md, synopsis.pdf

reference_files: []          # 작법 레퍼런스 파일명 목록 (input/references/ 내)
  # 예: ["screenplay_theory.md", "touch_screenplay.docx"]

style_reference:             # 문체를 빌려 올 원전 (선택). sources 가 비어 있으면 기본 문체 원칙만 따른다
  sources: []                # 예: [{author: "채만식", work: "레디메이드 인생", apply_to: [narration, inner]}]
    # apply_to: narration(서술·대지문 톤) | inner(내면 서술) | dialogue(대사, 인물명 지정 가능) | action(시나리오 지문)
  intensity: medium          # light(어휘·리듬) | medium(+서술자 논평·비유) | strong(+문장 구조, 시나리오 비권장)
  keep: []                   # 꼭 가져올 특징 (예: ["서술자의 비꼬는 논평", "판소리 사설조 리듬"])
  avoid: []                  # 가져오지 않을 특징 (예: ["1930년대 어휘", "한자어 과다"])
  excerpt_files: []          # 원문 발췌 파일 (input/references/style/ 내) — 없으면 기억 기반 분석으로 표시된다
  # 첫 집필 전에 prompts/style/style_profile.md 로 output/style_profile.md 를 만들고 사용자 승인을 받는다

# ─────────────────────────────────────────────
# web_novel 전용 설정 (target_format: web_novel 일 때만 사용)
# ─────────────────────────────────────────────
web_novel:
  total_episodes: 200        # 총 회차 수
  chars_per_episode: 5000    # 회차당 목표 분량 (공백 제외 글자 수)
  char_min: 4800             # 허용 하한 (공백 제외) — 미달 시 보강
  char_max: 5500             # 허용 상한 (공백 제외) — 초과 시 다음 회차로 넘기거나 압축
  paywall_episode: 25        # 유료 전환 회차 (이 회차부터 유료). 0 이면 유료 전환 설계 없음
  batch_size: 10             # 한 번의 집필 요청이 이보다 크면 이 단위로 나눠 분량 검증
                             # (몇 화를 쓸지는 매번 사용자가 요청한다 — 자동 연속 집필 없음)
  platform: ""               # 연재 플랫폼 (예: 문피아, 카카오페이지, 네이버시리즈) — 문체/관습 참고용
